<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>NorthGate - p2p web sharing</title>
    <link href="/static/bootstrap/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/static/styles.css" rel="stylesheet"/>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="icon" type="image/png" href="/static/favicon.png">
  </head>
  <body>
    <div id="northgate_loading">
        <div class="d-flex flex-column align-items-center justify-content-center vh-100">
            <img src="/static/logo.png" alt="NorthGate Logo" class="mb-4" style="width: 600px;"/>
            <div id="northgate_loading_spinner" class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-3" id="northgate_loading_message">Starting NorthGate application...</p>
            <div class="alert alert-danger" style="display: none;" role="alert" id="northgate_loading_alert"></div>
        </div>
    </div>
    <script src="/static/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/static/jquery/jquery-4.0.0.min.js"></script>
    <script src="/static/northgate.js"></script>
  </body>
</html>
